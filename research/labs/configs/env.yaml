# volvence-labs environment configuration
# Override per-machine; do NOT commit secrets.

models:
  cache_dir: .labs/models
  hf_cache_dir: .labs/hf_cache
  # HF token: set env var HF_TOKEN or paste here (gitignored).
  hf_token: null

  defaults:
    llm: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    vision: facebook/ijepa_vits16
    # V-JEPA-S checkpoint (Meta FAIR); fallback to I-JEPA ViT-S if unavailable.

gpu:
  # "cpu" | "cuda" | "mps" | "auto"
  policy: mps
  # If policy=auto, prefer this device order.
  prefer: [cuda, mps, cpu]

scheduler:
  # Max parallel units for local ParallelRunner.
  max_workers: 4
  # Timeout per unit (seconds). 0 = no timeout.
  unit_timeout: 3600
