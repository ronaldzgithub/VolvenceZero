[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "volvence-labs"
version = "0.1.0"
description = "Cognitive AGI unified experiment framework for VolvenceZero."
requires-python = ">=3.10"
authors = [{ name = "VolvenceZero" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "gymnasium>=0.29",
    "minigrid>=2.3",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
volvence-labs = "volvence_labs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
