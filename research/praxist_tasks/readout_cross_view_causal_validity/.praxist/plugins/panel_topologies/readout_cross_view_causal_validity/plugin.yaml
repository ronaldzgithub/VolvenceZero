schema_version: 1
name: readout_cross_view_causal_validity
kind: panel_topology
version: 0.1.0
protocol_version: 1
stability: pilot
description: Multi-PI topology for bounded cross-view residual-reader research.
compatibility:
  praxist_core: ">=0.5.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - panel.multi_pi
  - panel.round1_independent_memos
  - panel.round2_cross_review
  - panel.chair_agenda
  - panel.peer_role_rotation
topology:
  topology_ref: panel_topology:readout_cross_view_causal_validity
  chair_role_ref: task_role:chair
  peer_memo_visibility: anonymized
  high_stakes_triggers:
    - corpus or model digest drift
    - evaluator or threshold modification
    - label leakage or public-corpus overfit
    - causal sign or random-control failure
    - development evidence presented as formal qualification
    - semantic owner, ModificationGate, SHADOW, ACTIVE, or production claim
  modes:
    mini: [task_role:builder_pi, task_role:skeptic_pi]
    full: [task_role:builder_pi, task_role:skeptic_pi, task_role:portfolio_pi]
    high_stakes: [task_role:builder_pi, task_role:skeptic_pi, task_role:portfolio_pi, task_role:external_validity_pi]
  roles:
    - role_id: builder
      legacy_role_id: builder
      role_ref: task_role:builder_pi
      role_kind: pi
      model_profile_ref: strong_reasoner
      private_pack_key: builder
    - role_id: skeptic
      legacy_role_id: skeptic
      role_ref: task_role:skeptic_pi
      role_kind: pi
      model_profile_ref: strong_reasoner
      private_pack_key: skeptic
    - role_id: portfolio
      legacy_role_id: portfolio
      role_ref: task_role:portfolio_pi
      role_kind: pi
      model_profile_ref: strong_reasoner
      private_pack_key: portfolio
    - role_id: external_validity
      legacy_role_id: external_validity
      role_ref: task_role:external_validity_pi
      role_kind: pi
      model_profile_ref: strong_reasoner
      private_pack_key: external_validity
  rounds:
    - round_id: evidence_freeze
      role_refs: []
      parallelism: 1
      timeout_seconds: 0
      visibility: shared
    - round_id: independent_memos
      role_refs: [task_role:builder_pi, task_role:skeptic_pi, task_role:portfolio_pi, task_role:external_validity_pi]
      parallelism: 4
      timeout_seconds: 600
      model_profile_ref: strong_reasoner
      visibility: private_pack
    - round_id: cross_review
      role_refs: [task_role:builder_pi, task_role:skeptic_pi, task_role:portfolio_pi, task_role:external_validity_pi]
      parallelism: 4
      timeout_seconds: 420
      model_profile_ref: strong_reasoner
      visibility: anonymized_peer_memos
    - round_id: chair_synthesis
      role_refs: [task_role:chair]
      parallelism: 1
      timeout_seconds: 1080
      model_profile_ref: strong_reasoner
      visibility: shared_core_and_memos
  peer_role_rotation: [starter, solver, analyst, peer_generalist]
  peer_role_descriptions:
    starter: Build one coherent structured reader from the baseline and frozen task evidence.
    solver: Improve the weakest qualification margin with complete evaluator-backed ablation.
    analyst: Diagnose view, calibration, geometry, causal-sign, or random-control failures before changing a field.
    peer_generalist: Choose the highest-value reader experiment from committed evidence and PI guidance.
code: []
assets: []
