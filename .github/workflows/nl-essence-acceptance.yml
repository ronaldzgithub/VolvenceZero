name: NL Essence Acceptance

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  nl-essence-acceptance:
    runs-on: ubuntu-latest
    # Raised from 20: the job now also does a 35-wheel editable workspace
    # install before the 120 benchmark tests and the acceptance run.
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Install torch from the CPU wheel index first. The default PyPI
          # wheel now resolves to the CUDA stack (nvidia-* / triton /
          # cuda-toolkit, several GB) and exhausts the runner disk mid-install
          # with "[Errno 28] No space left on device". The bare `torch` pin in
          # requirements-ci.txt is then already satisfied.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt

      - name: Install workspace wheels (editable)
        run: |
          # `volvence_zero` lives in packages/vz-*/src, so the workspace wheels
          # must be installed or every import fails with ModuleNotFoundError.
          # install.sh is the repo's single entry point (two-pass editable
          # install that breaks the circular workspace deps); --no-build-isolation
          # reuses the already-present setuptools instead of building one
          # isolated env per wheel.
          python -m pip install --upgrade setuptools wheel
          bash install.sh --no-build-isolation

      - name: Run dialogue benchmark regression tests
        run: python -m pytest tests/test_dialogue_benchmark.py -q

      - name: Run NL essence acceptance benchmark
        run: bash scripts/run_nl_essence_acceptance.sh
