[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vz-embodiment-ant"
version = "0.1.0"
description = "Digital-ant embodiment: a non-language 2D sensorimotor substrate that plugs the frozen VZ layered kernel (temporal / memory / cognition) into an insect-scale foraging body via the public SubstrateAdapter contract. Research testbed for R2/R3-R4/R5-R6/R-PE/SSOT independent of any LLM."
requires-python = ">=3.11"
authors = [{ name = "Volvence Zero Contributors" }]
license = { text = "Proprietary" }
dependencies = [
    # Snapshot / RuntimeModule / WiringLevel contracts.
    "vz-contracts==0.1.*",
    # SubstrateAdapter ABC + SubstrateSnapshot / FeatureSignal types.
    "vz-substrate==0.1.*",
    # Thin orchestration facade (AgentSessionRunner / Brain). The
    # embodiment package enters the brain core ONLY through this
    # facade + the contracts wheel; it never imports vz-temporal /
    # vz-memory / vz-cognition internals directly (enforced by
    # tests/test_import_boundaries.py).
    "vz-runtime==0.1.*",
    "numpy",
]

[project.optional-dependencies]
# Test-only closure. The SHIPPED library never imports vz-temporal / vz-memory
# internals — tests/test_import_boundaries.py enforces that over src/. The
# package's own suite does import two of them, because a few tests act as
# CALLERS of the embodiment rather than as embodiment code: they construct the
# opaque ``JointLoopSchedule`` that ``AntSessionConfig.joint_schedule`` takes as
# a plain ``object`` (and drive ``ETANLJointLoop`` in the mechanism audit), and
# they name an owner-published ``Track`` while auditing kernel checkpoints.
# Declaring the wheels here keeps the dependency closure honest instead of
# relying on "the monorepo happens to have everything installed"; the same test
# module asserts they stay OUT of [project].dependencies.
# Optional-backend tests (torch / viz / app below) skip themselves when their
# extra is absent, so they are not repeated here. Repo-root scripts/run_ant_*.py
# are monorepo integration surface, not wheel surface, and are out of scope.
test = [
    "pytest",
    "pytest-asyncio",
    "vz-temporal==0.1.*",
    "vz-memory==0.1.*",
]
# Optional evidence lane: reuses the substrate-agnostic torch proofs
# (run_internal_rl_proof / run_strict_eta_evidence).
torch = ["vz-runtime[torch]==0.1.*"]
# Optional visualization dependency for trajectory replay demos.
viz = ["matplotlib"]
# Realtime React/Vite experiment host.  Kept optional so the non-language
# substrate and formal evidence runners retain their minimal dependency set.
app = ["aiohttp>=3.9"]

[project.scripts]
digital-ant-app = "volvence_ant.app.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["volvence_ant*"]
