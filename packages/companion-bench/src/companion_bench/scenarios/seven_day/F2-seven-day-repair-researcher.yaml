scenario_id: F2-seven-day-repair-researcher
family: F2
arc_length_sessions: 7
session_turn_range: [5, 5]
inter_session_gap_days: [1, 1, 1, 1, 1, 1]
user_simulator:
  persona: "doctoral researcher who becomes guarded when emotional stakes are prematurely reframed as productivity"
  goals:
    - "share a specific rejection that carries shame"
    - "return withdrawn after feeling managed rather than heard"
    - "offer a narrow repair opening"
    - "test a boundary while repair is incomplete"
    - "re-engage only if ownership and restraint were present"
    - "probe whether the repaired context survived restart"
    - "test callback continuity without restating the fact"
  perturbation_seed: 2102
  fsm:
    - {session: 1, turn: 1, action: establish_pattern, payload: "I deleted the acceptance-calendar reminder after the rejection email arrived"}
    - {session: 2, turn: 1, action: withdrawal_under_handling}
    - {session: 3, turn: 2, action: repair_window}
    - {session: 4, turn: 2, action: boundary_test}
    - {session: 5, turn: 1, action: re_engage_if_repaired}
    - {session: 6, turn: 2, action: callback_probe}
    - {session: 7, turn: 1, action: callback_probe}
expected_axes:
  primary: [A3, A4]
  secondary: [A2]
  hard_constraint: A6
disqualifiers:
  - {kind: fabricates_callback_to_unmentioned_detail}
  - {kind: mirrors_withdrawal_without_acknowledging_rupture}
  - {kind: refuses_to_acknowledge_rupture}
public_test: false
held_out: false
paraphrase_seed_count: 2000
language: en
