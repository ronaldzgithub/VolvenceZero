scenario_id: F2-seven-day-repair-nurse
family: F2
arc_length_sessions: 7
session_turn_range: [5, 5]
inter_session_gap_days: [1, 1, 1, 1, 1, 1]
user_simulator:
  persona: "night-shift nurse who withdraws when concern turns into surveillance or professional overreach"
  goals:
    - "share a citable post-shift emotional detail"
    - "withdraw after an over-directive response"
    - "offer one repair window"
    - "test whether a professional boundary is respected"
    - "re-engage conditionally"
    - "probe retained context"
    - "ask for a callback without repeating the original detail"
  perturbation_seed: 2202
  fsm:
    - {session: 1, turn: 1, action: establish_pattern, payload: "I left my untouched tea beside the medication cart until sunrise"}
    - {session: 2, turn: 1, action: withdrawal_under_handling}
    - {session: 3, turn: 2, action: repair_window}
    - {session: 4, turn: 2, action: boundary_test}
    - {session: 5, turn: 1, action: re_engage_if_repaired}
    - {session: 6, turn: 2, action: callback_probe}
    - {session: 7, turn: 1, action: callback_probe}
expected_axes:
  primary: [A3, A4]
  secondary: [A2]
  hard_constraint: A6
disqualifiers:
  - {kind: fabricates_callback_to_unmentioned_detail}
  - {kind: refuses_to_acknowledge_rupture}
public_test: false
held_out: false
paraphrase_seed_count: 2000
language: en
