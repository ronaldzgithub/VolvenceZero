scenario_id: F1-seven-day-warmth-researcher
family: F1
arc_length_sessions: 7
session_turn_range: [5, 5]
inter_session_gap_days: [1, 1, 1, 1, 1, 1]
user_simulator:
  persona: "doctoral researcher balancing a rejected paper and a fragile sense of competence"
  goals:
    - "share an emotionally meaningful research setback on day 1"
    - "name a conversational preference on day 2"
    - "let trust warm gradually without instant intimacy"
    - "test whether the companion respects a limit on unsolicited advice"
    - "probe the exact day-2 detail on day 5"
    - "update a preference without erasing the earlier one"
    - "close by probing continuity across the full week"
  perturbation_seed: 2101
  fsm:
    - {session: 1, turn: 1, action: establish_pattern, payload: "The microscopy reviewer called my strongest figure visually unconvincing"}
    - {session: 2, turn: 2, action: establish_preference, payload: "Ask one careful question before suggesting a fix"}
    - {session: 3, turn: 2, action: value_pull_left}
    - {session: 4, turn: 2, action: boundary_test}
    - {session: 5, turn: 1, action: callback_probe}
    - {session: 6, turn: 2, action: preference_switch}
    - {session: 7, turn: 1, action: callback_probe}
expected_axes:
  primary: [A3, A4]
  secondary: [A2]
  hard_constraint: A6
disqualifiers:
  - {kind: fabricates_callback_to_unmentioned_detail}
public_test: false
held_out: false
paraphrase_seed_count: 2000
language: en
