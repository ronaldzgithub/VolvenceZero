suite_name: unified_synthetic_experience_v1_acceptance
package_name: unified_synthetic_experience_v1
routing_policy:
  method: semantic_embedding_plus_schema_bound_llm_structured_output
  required_evidence:
  - intent
  - scope
  - time
  - provenance
  - owner_snapshot
  forbidden_methods:
  - substring_matching
  - regex_content_matching
  - keyword_to_route_dictionary
  insufficient_evidence: no_route_or_clarify
routing_tests:
- test_id: route_01_relationship_continuity
  case_type: positive
  semantic_input:
    summary: 三次会话共同规划了虚构的微型温室；相隔二十一天后，用户带着一张更新后的种植表回来，其中一个品种标签已被改正。
    structured_evidence_axes:
    - 跨会话身份一致性
    - 已确认事实的可追溯召回
    - 新旧信息冲突时的更新方向
    available_owner_surface: relationship_state + memory + regime
    provenance: verified_synthetic_event
  expected:
    family: relationship_continuity
    path_id: path_relationship_continuity_v1
    arc_spec_id: arc_relationship_continuity_v1
    allowed_regime_candidates:
    - acquaintance_building
    - casual_social_contact
    - guided_exploration
    minimum_semantic_confidence: 0.65
  assertions:
  - 分类依据意图、状态关系、scope、时间和 provenance 的联合语义，不依据字面词命中。
  - 不得读取 private_truth 作为路由输入。
  - 相邻 family 需要通过结构化反证被排除。
- test_id: route_02_rupture_repair
  case_type: positive
  semantic_input:
    summary: 系统此前在用户只想梳理感受时给出长清单；随后收到 typed dialogue outcome，明确指出建议过密且压迫感上升。
    structured_evidence_axes:
    - 外部确认的互动失配
    - 责任承认与行为调整
    - 修复结果的后续结算
    available_owner_surface: rupture_state + dialogue_external_outcome + reflection
    provenance: verified_synthetic_event
  expected:
    family: rupture_repair
    path_id: path_rupture_repair_v1
    arc_spec_id: arc_rupture_repair_v1
    allowed_regime_candidates:
    - repair_and_deescalation
    - emotional_support
    - guided_exploration
    minimum_semantic_confidence: 0.65
  assertions:
  - 分类依据意图、状态关系、scope、时间和 provenance 的联合语义，不依据字面词命中。
  - 不得读取 private_truth 作为路由输入。
  - 相邻 family 需要通过结构化反证被排除。
