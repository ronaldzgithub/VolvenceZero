[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeform-domain-venture"
version = "0.1.0"
description = "Foundry-facing Venture Brain cognitive sidecar vertical."
requires-python = ">=3.11"
authors = [{ name = "Volvence Zero Contributors" }]
license = { text = "Proprietary" }
dependencies = [
    "vz-contracts==0.1.*",
    "vz-memory==0.1.*",
    "vz-cognition==0.1.*",
    "vz-application==0.1.*",
    "vz-runtime==0.1.*",
    "lifeform-core==0.1.*",
]

[project.scripts]
venture-foundry-contract = "lifeform_domain_venture.foundry_public_contract:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lifeform_domain_venture*"]

[tool.setuptools.package-data]
lifeform_domain_venture = ["fixtures/*.json", "schemas/*.json"]
